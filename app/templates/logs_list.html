{% extends "base.html" %}
{% block content %}
<h1 class="mb-3">Uploaded Logs</h1>

<table class="table table-hover align-middle">
    <thead>
    <tr>
        <th>Filename</th>
        <th>Uploaded At</th>
        <th>Total Entries</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    {% for log in logs %}
        <tr>
            <td>{{ log.filename }}</td>
            <td>{{ log.uploaded_at }}</td>
            <td>{{ log.total_entries }}</td>
            <td>
                <a href="/logs/{{ log.id }}" class="btn btn-sm btn-primary">View</a>

                <form action="/logs/delete/{{ log.id }}" method="post" style="display:inline;">
                    <button class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure you want to delete this log? This action cannot be undone.')">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
